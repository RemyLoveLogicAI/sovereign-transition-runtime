name: STR CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: STR acceptance suite (12/12)
        run: |
          python test_str.py
      - name: Race proof (4 concurrent approvals, exactly-once)
        run: |
          python test_race.py
